baseURL = '/'
locale = 'en'
title = 'Breakthrough Science Society'
cleanDestinationDir = true

[[menus.main]]
  identifier = "home"
  name = "Home"
  url = "/"
  weight = 1

[[menus.main]]
  name   = "Articles"
  url    = "/articles/"
  weight = 10

[[menus.main]]
  identifier = "publications"
  name   = "Publications"
  url    = "/publications/"
  weight = 20

[[menus.main]]
  name   = "Search Publications"
  url    = "/publications/"
  parent = "publications"
  weight = 40

[[menus.main]]
  identifier = "publications-magazines"
  name   = "Magazines"
  url    = "/publications/magazines/"
  parent = "publications"
  weight = 10

[[menus.main]]
  name   = "‘BREAKTHROUGH’ Journal"
  url    = "/publications/magazines/breakthrough-journal/"
  parent = "publications-magazines"
  weight = 11

[[menus.main]]
  name   = "Prakriti (Bengali)"
  url    = "/publications/magazines/prakriti-bengali/"
  parent = "publications-magazines"
  weight = 12

[[menus.main]]
  name   = "Breakthrough Bulletin (Hindi)"
  url    = "/publications/magazines/breakthrough-bulletin-hindi/"
  parent = "publications-magazines"
  weight = 13

[[menus.main]]
  name   = "Major Articles"
  url    = "/publications/major-articles/"
  parent = "publications"
  weight = 20

[[menus.main]]
  name   = "Books"
  url    = "/publications/books/"
  parent = "publications"
  weight = 30

[[menus.main]]
  name   = "News"
  url    = "/news/"
  weight = 30

[[menus.main]]
  name   = "Events"
  url    = "/events/"
  weight = 40

[[menus.main]]
  name   = "Membership"
  url    = "/membership/"
  weight = 45
  [menus.main.params]
    class = "nav-membership"

[[menus.main]]
  name   = "About"
  url    = "/about/"
  weight = 50

[taxonomies]
  tag      = "tags"
  category = "categories"
  state    = "states"

[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "state-repos/state-karnataka/content/articles"
    target = "content/articles"
  [[module.mounts]]
    source = "state-repos/state-karnataka/content/news"
    target = "content/news"
  [[module.mounts]]
    source = "state-repos/state-karnataka/content/events"
    target = "content/events"
  [[module.mounts]]
    source = "state-repos/state-kerala/content/articles"
    target = "content/articles"
  [[module.mounts]]
    source = "state-repos/state-kerala/content/news"
    target = "content/news"
  [[module.mounts]]
    source = "state-repos/state-kerala/content/events"
    target = "content/events"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup.goldmark.renderer]
  unsafe = true

[params]
  description = "A production-ready Hugo site built with best practices."
  [params.social]
    # twitter = ""  # Set your Twitter/X handle here when ready
    github  = "anand-raj"

[related]
  threshold    = 60
  includeNewer = true
  [[related.indices]]
    name   = "tags"
    weight = 80
  [[related.indices]]
    name   = "categories"
    weight = 60
  [[related.indices]]
    name   = "date"
    weight = 10

